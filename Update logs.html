<!DOCTYPE html>
<html>
<head>
<title>Update Logs</title>
<style>
body {
  font-family: sans-serif;
}

table {
  border-collapse: collapse;
  width: 95%;
  margin: 0 20px; /* 20px margin on left and right, no margin on top and bottom */
}

th, td {
  border: 1px solid black;
  padding: 5px;
}
table th:first-child,
table td:first-child {
  width: 10%;
}

table th:last-child,
table td:last-child {
  width: 90%;
}
th {
  background-color: #ccc;
}

.smol {
  font-size: 10px
}

.special {
  font-size: 30px;
  color: #7332ff
}

img {
  max-width: 100%;
  height: auto;
}

/* Button styling */
.button {
  position: fixed;
  bottom: 20px;
  right: 20px;
  padding: 10px 20px;
  font-size: 16px;
  color: #fff;
  background-color: #007bff;
  text-decoration: none;
  border-radius: 5px;
  text-align: center;
  z-index: 1000; /* optional: make sure it stays on top */
}

.button:hover {
  background-color: #0056b3;
}

</style>
</head>
